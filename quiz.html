<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic Meme Personality Quiz</title>

<style>
  body {
    background: linear-gradient(135deg, #ff00ff, #00ffff, #00ff00);
    font-family: "Comic Sans MS", cursive;
    color: #fff;
    text-align: center;
    margin: 0;
    padding: 20px;
  }

  h1 {
    font-size: 3rem;
    text-shadow: 2px 2px 10px #000;
    margin-bottom: 10px;
  }

  .quiz-box {
    background: rgba(0,0,0,0.4);
    border: 3px solid #fff;
    padding: 20px;
    width: 80%;
    margin: auto;
    box-shadow: 0 0 20px #fff;
  }

  .question {
    font-size: 1.5rem;
    margin-bottom: 20px;
  }

  .answers button {
    background: linear-gradient(90deg, #ff00ff, #00ffff);
    border: none;
    padding: 10px 20px;
    margin: 10px;
    border-radius: 10px;
    font-size: 1.2rem;
    cursor: pointer;
    color: #000;
    font-weight: bold;
    box-shadow: 0 0 10px #fff;
    transition: 0.2s;
  }

  .answers button:hover {
    transform: scale(1.1);
    box-shadow: 0 0 20px #ff0;
  }

  #result {
    margin-top: 30px;
    font-size: 2rem;
    text-shadow: 0 0 10px #fff;
  }

  #restart {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 1.2rem;
    background: #ff0;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
</style>
</head>

<body>

<h1>✨ Classic Meme Personality Quiz ✨</h1>

<div class="quiz-box">
  <div id="quiz"></div>
  <div id="result"></div>
  <button id="restart" style="display:none;" onclick="restartQuiz()">Restart Quiz</button>
</div>

<!-- ⭐ BACK TO HOME BUTTON ⭐ -->
<a href="index.html" 
style="display:inline-block;margin-top:30px;background:linear-gradient(90deg,#ff00ff,#00ffff);
color:#000;padding:10px 20px;border-radius:10px;text-decoration:none;font-weight:bold;
box-shadow:0 0 10px #fff;transition:0.2s;"
onmouseover="this.style.boxShadow='0 0 20px #ff0'; this.style.transform='scale(1.1)'"
onmouseout="this.style.boxShadow='0 0 10px #fff'; this.style.transform='scale(1)'">
⬅️ Back to Home Page
</a>

<script>
const memes = {
  trollface: 0,
  doge: 0,
  nyan: 0,
  brian: 0,
  success: 0
};

const questions = [
  {
    q: "How do you react when something goes wrong?",
    a: [
      { text: "Laugh it off", meme: "trollface" },
      { text: "Stay positive", meme: "success" },
      { text: "Pretend it's fine", meme: "doge" },
      { text: "It ALWAYS happens to me", meme: "brian" },
      { text: "Zoom away into space", meme: "nyan" }
    ]
  },
  {
    q: "Pick a vibe:",
    a: [
      { text: "Chaotic energy", meme: "trollface" },
      { text: "Wholesome and silly", meme: "doge" },
      { text: "Colorful and hyper", meme: "nyan" },
      { text: "Unlucky but funny", meme: "brian" },
      { text: "Motivated and determined", meme: "success" }
    ]
  },
  {
    q: "Choose a sound effect:",
    a: [
      { text: "Troll laugh", meme: "trollface" },
      { text: "Wow.", meme: "doge" },
      { text: "Nyan nyan nyan", meme: "nyan" },
      { text: "Oof.", meme: "brian" },
      { text: "Victory fanfare", meme: "success" }
    ]
  },
  {
    q: "Your daily mood:",
    a: [
      { text: "Chaotic neutral", meme: "trollface" },
      { text: "Wholesome chaos", meme: "doge" },
      { text: "Hyperactive rainbow", meme: "nyan" },
      { text: "Accidentally unlucky", meme: "brian" },
      { text: "Small wins", meme: "success" }
    ]
  },
  {
    q: "Pick your destiny:",
    a: [
      { text: "Cause mischief", meme: "trollface" },
      { text: "Spread positivity", meme: "doge" },
      { text: "Fly through space", meme: "nyan" },
      { text: "Fail hilariously", meme: "brian" },
      { text: "Achieve greatness", meme: "success" }
    ]
  }
];

let current = 0;

function loadQuestion() {
  if (current >= questions.length) return showResult();

  const q = questions[current];
  let html = `<div class='question'>${q.q}</div><div class='answers'>`;

  q.a.forEach(ans => {
    html += `<button onclick="choose('${ans.meme}')">${ans.text}</button>`;
  });

  html += "</div>";
  document.getElementById("quiz").innerHTML = html;
}

function choose(meme) {
  memes[meme]++;
  current++;
  loadQuestion();
}

function showResult() {
  let result = Object.keys(memes).reduce((a, b) => memes[a] > memes[b] ? a : b);

  const names = {
    trollface: "Trollface 😈",
    doge: "Doge 🐶",
    nyan: "Nyan Cat 🌈",
    brian: "Bad Luck Brian 😬",
    success: "Success Kid 💪"
  };

  const desc = {
    trollface: "You're chaotic, mischievous, and love causing harmless trouble.",
    doge: "You're wholesome, silly, and bring joy everywhere.",
    nyan: "You're energetic, colorful, and unstoppable.",
    brian: "You're unlucky in the funniest possible way.",
    success: "You're determined, optimistic, and always pushing forward."
  };

  document.getElementById("quiz").style.display = "none";
  document.getElementById("result").innerHTML =
    `You are <strong>${names[result]}</strong><br><br>${desc[result]}`;

  document.getElementById("restart").style.display = "inline-block";
}

function restartQuiz() {
  current = 0;
  for (let m in memes) memes[m] = 0;
  document.getElementById("quiz").style.display = "block";
  document.getElementById("result").innerHTML = "";
  document.getElementById("restart").style.display = "none";
  loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
