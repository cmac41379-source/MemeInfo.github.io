<!DOCTYPE html>
<html>
<head>
    <title>Meme Feed</title>
    <meta charset="UTF-8">
</head>

<body style="background: #fceaff; font-family: Comic Sans MS;">

    <!-- POST BOX -->
    <div id="postBox" style="width: 100%; max-width: 500px; margin: 20px auto; padding: 15px; background: #fff; border: 2px solid #000; border-radius: 10px;">
        <h2 style="text-align: center;">Create a Post</h2>

        <textarea id="postText" 
                  placeholder="Type your meme here..." 
                  style="width: 100%; height: 120px; padding: 10px; font-size: 16px; border: 2px solid #000; border-radius: 8px; resize: none;">
        </textarea>

        <button id="postButton" 
                style="margin-top: 10px; width: 100%; padding: 12px; background: #00ccff; border: 2px solid #000; border-radius: 8px; font-size: 18px; cursor: pointer;">
            Post
        </button>

        <p id="postStatus" style="text-align: center; margin-top: 10px;"></p>
    </div>

    <!-- FEED DISPLAY -->
    <div id="feed" style="width: 100%; max-width: 600px; margin: 20px auto;"></div>


    <!-- FIREBASE + POSTING + AI MODERATION + FEED DISPLAY -->
    <script type="module">
        // Firebase imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            serverTimestamp, 
            collection, 
            query, 
            where, 
            orderBy, 
            getDocs 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        import { 
            getAuth, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // Your Firebase config (PUT YOUR VALUES HERE)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Elements
        const postButton = document.getElementById("postButton");
        const postText = document.getElementById("postText");
        const postStatus = document.getElementById("postStatus");
        const feedDiv = document.getElementById("feed");

        // ⭐ AI MODERATION FUNCTION
        function aiModerate(text) {
            const badWords = [
                "nsfw", "porn", "sex", "kill", "die", "slur", "racist",
                "gore", "blood", "disgusting", "gross", "violent"
            ];

            for (let w of badWords) {
                if (text.toLowerCase().includes(w)) {
                    return { safe: false, reason: "Blocked word detected: " + w };
                }
            }

            // Safe
            return { safe: true, reason: "" };
        }

        // ⭐ LOAD FEED POSTS
        async function loadFeed() {
            feedDiv.innerHTML = "<p style='text-align:center;'>Loading feed...</p>";

            const q = query(
                collection(db, "posts"),
                where("approved", "==", true),
                orderBy("timestamp", "desc")
            );

            const snap = await getDocs(q);

            feedDiv.innerHTML = "";

            snap.forEach(docSnap => {
                const data = docSnap.data();

                const postEl = document.createElement("div");
                postEl.style = "background:#fff; border:2px solid #000; padding:15px; margin-bottom:15px; border-radius:10px;";

                postEl.innerHTML = `
                    <div style="display:flex; align-items:center;">
                        <img src="${data.pfpURL}" style="width:50px; height:50px; border-radius:50%; border:2px solid #000; margin-right:10px;">
                        <strong>${data.username}</strong>
                    </div>
                    <p style="margin-top:10px;">${data.text}</p>
                    <small>Posted at: ${data.timestamp?.toDate()}</small>
                `;

                feedDiv.appendChild(postEl);
            });
        }

        // ⭐ WAIT FOR USER LOGIN
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                postStatus.innerText = "You must be logged in to post.";
                return;
            }

            // ⭐ HANDLE POSTING
            postButton.onclick = async () => {
                const text = postText.value.trim();

                if (text.length === 0) {
                    postStatus.innerText = "Post cannot be empty.";
                    return;
                }

                // AI moderation
                const mod = aiModerate(text);

                if (!mod.safe) {
                    postStatus.innerText = "Post blocked: " + mod.reason;
                    return;
                }

                postStatus.innerText = "Posting...";

                // Generate unique ID
                const postID = crypto.randomUUID();

                // Save post to Firestore
                await setDoc(doc(db, "posts", postID), {
                    userID: user.uid,
                    username: user.displayName || "Unknown",
                    pfpURL: user.photoURL || "",
                    text: text,
                    timestamp: serverTimestamp(),
                    approved: true,
                    flagged: false,
                    reason: "",
                    expiresAt: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000)
                });

                postStatus.innerText = "Posted!";
                postText.value = "";

                loadFeed();
            };

            // Load feed on page load
            loadFeed();
        });
    </script>

</body>
</html>
