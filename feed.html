<div id="postBox" style="width: 100%; max-width: 500px; margin: 20px auto; padding: 15px; background: #fff; border: 2px solid #000; border-radius: 10px;">
    <h2 style="font-family: Comic Sans MS; text-align: center;">Create a Post</h2>

    <!-- Text area -->
    <textarea id="postText" 
              placeholder="Type your meme here..." 
              style="width: 100%; height: 120px; padding: 10px; font-size: 16px; border: 2px solid #000; border-radius: 8px; resize: none;">
    </textarea>

    <!-- Post button -->
    <button id="postButton" 
            style="margin-top: 10px; width: 100%; padding: 12px; background: #00ccff; border: 2px solid #000; border-radius: 8px; font-size: 18px; font-family: Comic Sans MS; cursor: pointer;">
        Post
    </button>

    <!-- Status message -->
    <p id="postStatus" style="text-align: center; margin-top: 10px; font-family: Comic Sans MS;"></p>
</div>
