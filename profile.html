<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile</title>

  <style>
    body {
      background: linear-gradient(135deg, #00ff00, #ff00ff, #0000ff);
      font-family: "Comic Sans MS", cursive, sans-serif;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    #profileContainer {
      background: rgba(0,0,0,0.5);
      border: 3px solid #fff;
      width: 80%;
      margin: 20px auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px #fff;
    }

    #editProfileBtn {
      background: #00ffff;
      border: 3px solid #000;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      color: #000;
    }

    #friendBtn {
      background: #ff00ff;
      border: 3px solid #000;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      color: #000;
      display:none;
    }

    .post {
      background: #fff;
      color: #000;
      border: 3px solid #000;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: left;
    }
  </style>
</head>

<body>

  <div id="profileContainer">
    <h1 id="usernameDisplay">Loading...</h1>
    <img id="pfpDisplay" src="" style="width:120px;height:120px;border-radius:50%;border:3px solid #fff;">
    <p id="bioDisplay"></p>
    <p id="joinedDisplay"></p>
    <p id="coinsDisplay"></p>

    <!-- ⭐ MEMBERSHIP DISPLAY ⭐ -->
    <h3>Membership Title</h3>
    <p id="membershipDisplay">Loading...</p>
    <div id="membershipButtons" style="margin-top:15px;"></div>

    <button id="editProfileBtn">Edit Profile</button>
    <button id="friendBtn">Add Friend</button>
  </div>

  <a href="index.html" 
     style="display:inline-block;margin-top:20px;background:#00ffff;
            padding:10px 20px;border-radius:10px;border:3px solid #000;
            font-weight:bold;color:#000;text-decoration:none;">
    ⬅ Back Home
  </a>

  <h2>User Posts</h2>
  <div id="postsContainer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  setDoc,
  collection,
  query,
  where,
  getDocs,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBcEOwx6eKMm_-6vIV1ZuRwPIXvYHAFHWQ",
  authDomain: "meme-encyclopedia.firebaseapp.com",
  projectId: "meme-encyclopedia",
  storageBucket: "meme-encyclopedia.firebasestorage.app",
  messagingSenderId: "496237997014",
  appId: "1:496237997014:web:382e628a4da83219ced277"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const urlParams = new URLSearchParams(window.location.search);
const viewingUID = urlParams.get("uid");

onAuthStateChanged(auth, async user => {
  if (!user) {
    alert("You must be logged in.");
    window.location.href = "index.html";
    return;
  }

  const actualUID = viewingUID || user.uid;
  const userRef = doc(db, "users", actualUID);
  const snap = await getDoc(userRef);

  if (!snap.exists()) {
    document.getElementById("usernameDisplay").innerText = "User not found.";
    return;
  }

  const data = snap.data();

  document.getElementById("usernameDisplay").innerText = data.username || data.email;
  document.getElementById("pfpDisplay").src = data.pfp || "";
  document.getElementById("bioDisplay").innerText = data.bio || "No bio yet.";
  document.getElementById("joinedDisplay").innerText = "Joined: " + data.joined;
  document.getElementById("coinsDisplay").innerText = "Coins: " + data.coins;

  // ⭐ MEMBERSHIP DISPLAY
  document.getElementById("membershipDisplay").innerText =
    data.membership_title || "None selected";

  // ⭐ SHOW MEMBERSHIP BUTTONS (only for your own profile)
  if (!viewingUID || viewingUID === user.uid) {
    const btnBox = document.getElementById("membershipButtons");
    btnBox.innerHTML = "";

    if (data.shop_trollface) {
      const btn = document.createElement("button");
      btn.innerText = "Use Trollface Member";
      btn.style = "background:#ff00ff;border:3px solid #fff;padding:10px;margin:5px;border-radius:10px;cursor:pointer;";
      btn.onclick = () => setMembership("TROLLFACE MEMBER");
      btnBox.appendChild(btn);
    }

    if (data.shop_cheems) {
      const btn = document.createElement("button");
      btn.innerText = "Use Cheems Member";
      btn.style = "background:#ffaa00;border:3px solid #fff;padding:10px;margin:5px;border-radius:10px;cursor:pointer;";
      btn.onclick = () => setMembership("CHEEMS MEMBER");
      btnBox.appendChild(btn);
    }

    if (data.shop_gigachad) {
      const btn = document.createElement("button");
      btn.innerText = "Use Gigachad Member";
      btn.style = "background:#00ffea;border:3px solid #fff;padding:10px;margin:5px;border-radius:10px;cursor:pointer;";
      btn.onclick = () => setMembership("GIGACHAD MEMBER");
      btnBox.appendChild(btn);
    }
  }

  async function setMembership(title) {
    const userRef = doc(db, "users", user.uid);
    await updateDoc(userRef, { membership_title: title });
    document.getElementById("membershipDisplay").innerText = title;
    alert("Membership updated to: " + title);
  }

  // ⭐ FIX #1 — Correct Edit Profile visibility
  const editBtn = document.getElementById("editProfileBtn");
  const friendBtn = document.getElementById("friendBtn");

  if (actualUID === user.uid) {
    editBtn.style.display = "block";
    friendBtn.style.display = "none";
  } else {
    editBtn.style.display = "none";
    friendBtn.style.display = "block";
  }

  // ⭐ FIX #2 — Make Edit Profile button work
  editBtn.onclick = () => {
    window.location.href = "settings.html";
  };

  // ⭐ POSTS WITH MEMBERSHIP TITLE
  const postsQuery = query(
    collection(db, "posts"),
    where("userID", "==", actualUID)
  );

  onSnapshot(postsQuery, (snap) => {
    const container = document.getElementById("postsContainer");
    container.innerHTML = "";

    snap.docs
      .sort((a, b) => (b.data().timestamp?.seconds || 0) - (a.data().timestamp?.seconds || 0))
      .forEach(docSnap => {
        const post = docSnap.data();

        const div = document.createElement("div");
        div.className = "post";

        div.innerHTML = `
          <strong>${post.username} — ${post.membership_title || ""}</strong><br>
          <p>${post.text}</p>
          <small>${post.timestamp?.toDate?.() || "Just now"}</small>
        `;

        container.appendChild(div);
      });
  });

});
</script>

</body>
</html>
