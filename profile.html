<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile</title>

  <style>
    body {
      background: linear-gradient(135deg, #00ff00, #ff00ff, #0000ff);
      font-family: "Comic Sans MS", cursive, sans-serif;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    #profileContainer {
      background: rgba(0,0,0,0.5);
      border: 3px solid #fff;
      width: 80%;
      margin: 20px auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px #fff;
    }

    #editProfileBtn {
      background: #00ffff;
      border: 3px solid #000;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      color: #000;
    }

    #friendBtn {
      background: #ff00ff;
      border: 3px solid #000;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      color: #000;
    }

    #postsContainer {
      margin-top: 30px;
    }

    .post {
      background: #fff;
      color: #000;
      border: 3px solid #000;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: left;
    }
  </style>
</head>

<body>
  <div id="profileContainer">
    <h1 id="usernameDisplay">Loading...</h1>
    <img id="pfpDisplay" src="" style="width:120px;height:120px;border-radius:50%;border:3px solid #fff;">
    <p id="bioDisplay"></p>
    <p id="joinedDisplay"></p>
    <p id="coinsDisplay"></p>

    <button id="editProfileBtn">Edit Profile</button>
    <button id="friendBtn" style="display:none;">Add Friend</button>
  </div>

  <h2>User Posts</h2>
  <div id="postsContainer"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  setDoc,
  collection,
  query,
  where,
  orderBy,
  getDocs,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBcEOwx6eKMm_-6vIV1ZuRwPIXvYHAFHWQ",
  authDomain: "meme-encyclopedia.firebaseapp.com",
  projectId: "meme-encyclopedia",
  storageBucket: "meme-encyclopedia.firebasestorage.app",
  messagingSenderId: "496237997014",
  appId: "1:496237997014:web:382e628a4da83219ced277"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
// ⭐ URL PARAMS
const urlParams = new URLSearchParams(window.location.search);
const viewingUID = urlParams.get("uid");

// ⭐ AUTH STATE
onAuthStateChanged(auth, async user => {
  if (!user) {
    alert("You must be logged in.");
    window.location.href = "index.html";
    return;
  }

  const actualUID = viewingUID || user.uid;
  const userRef = doc(db, "users", actualUID);
  const snap = await getDoc(userRef);

  if (!snap.exists()) {
    document.getElementById("usernameDisplay").innerText = "User not found.";
    return;
  }

  const data = snap.data();

  document.getElementById("usernameDisplay").innerText = data.username || data.email;
  document.getElementById("pfpDisplay").src = data.pfp || "";
  document.getElementById("bioDisplay").innerText = data.bio || "";
  document.getElementById("joinedDisplay").innerText = "Joined: " + data.joined;
  document.getElementById("coinsDisplay").innerText = "Coins: " + data.coins;

  // ⭐ FIX: Only show Edit Profile on YOUR profile
  if (actualUID === user.uid) {
    document.getElementById("editProfileBtn").style.display = "block";
  } else {
    document.getElementById("editProfileBtn").style.display = "none";
  }

  // ⭐ FRIEND BUTTON LOGIC
  const friendBtn = document.getElementById("friendBtn");

  if (actualUID !== user.uid) {
    friendBtn.style.display = "block";
  }

  const currentUserRef = doc(db, "users", user.uid);
  const currentSnap = await getDoc(currentUserRef);
  const currentData = currentSnap.data();

  const isFriend = currentData.friends?.includes(actualUID);
  const hasSent = currentData.sentRequests?.includes(actualUID);
  const hasReceived = currentData.friendRequests?.includes(actualUID);

  if (isFriend) {
    friendBtn.innerText = "Unfriend";
  } else if (hasSent) {
    friendBtn.innerText = "Cancel Request";
  } else if (hasReceived) {
    friendBtn.innerText = "Accept Request";
  } else {
    friendBtn.innerText = "Add Friend";
  }
  // ⭐ FRIEND BUTTON ACTIONS
  friendBtn.onclick = async () => {
    const currentUserRef = doc(db, "users", user.uid);
    const targetRef = doc(db, "users", actualUID);

    const currentSnap = await getDoc(currentUserRef);
    const targetSnap = await getDoc(targetRef);

    const currentData = currentSnap.data();
    const targetData = targetSnap.data();

    // ADD FRIEND
    if (friendBtn.innerText === "Add Friend") {
      await updateDoc(targetRef, {
        friendRequests: [...(targetData.friendRequests || []), user.uid]
      });

      await updateDoc(currentUserRef, {
        sentRequests: [...(currentData.sentRequests || []), actualUID]
      });

      friendBtn.innerText = "Cancel Request";
    }

    // CANCEL REQUEST
    else if (friendBtn.innerText === "Cancel Request") {
      await updateDoc(targetRef, {
        friendRequests: (targetData.friendRequests || []).filter(id => id !== user.uid)
      });

      await updateDoc(currentUserRef, {
        sentRequests: (currentData.sentRequests || []).filter(id => id !== actualUID)
      });

      friendBtn.innerText = "Add Friend";
    }

    // ACCEPT REQUEST
    else if (friendBtn.innerText === "Accept Request") {
      await updateDoc(currentUserRef, {
        friends: [...(currentData.friends || []), actualUID],
        friendRequests: (currentData.friendRequests || []).filter(id => id !== actualUID)
      });

      await updateDoc(targetRef, {
        friends: [...(targetData.friends || []), user.uid],
        sentRequests: (targetData.sentRequests || []).filter(id => id !== user.uid)
      });

      friendBtn.innerText = "Unfriend";
    }

    // UNFRIEND
    else if (friendBtn.innerText === "Unfriend") {
      await updateDoc(currentUserRef, {
        friends: (currentData.friends || []).filter(id => id !== actualUID)
      });

      await updateDoc(targetRef, {
        friends: (targetData.friends || []).filter(id => id !== user.uid)
      });

      friendBtn.innerText = "Add Friend";
    }
  };

  // ⭐ LOAD POSTS
  const postsQuery = query(
    collection(db, "posts"),
    where("userID", "==", actualUID),
    orderBy("timestamp", "desc")
  );

  onSnapshot(postsQuery, (snap) => {
    const container = document.getElementById("postsContainer");
    container.innerHTML = "";

    snap.forEach(docSnap => {
      const post = docSnap.data();

      const div = document.createElement("div");
      div.className = "post";

      div.innerHTML = `
        <strong>${post.username}</strong><br>
        <p>${post.text}</p>
        <small>${post.timestamp?.toDate?.() || "Just now"}</small>
      `;

      container.appendChild(div);
    });
  });

});
</script>

</body>
</html>
