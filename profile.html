<!DOCTYPE html>
<html>
<head>
  <title>Your Profile</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial;
      text-align: center;
      padding: 20px;
    }
    #pfp {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #fff;
      object-fit: cover;
      margin-bottom: 20px;
    }
    #box {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 10px;
      width: 80%;
      margin: auto;
    }
    a {
      color: #0ff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Your Profile</h1>

  <img id="pfp" src="" alt="Profile Picture">

  <div id="box">
    <h2 id="username">Username</h2>
    <p id="email">Email: loading...</p>
    <p id="bio">Bio: loading...</p>
    <p id="coins">Coins: loading...</p>
    <p id="joined">Joined: loading...</p>
  </div>

  <br>
  <a href="settings.html">Edit Profile</a>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcEOwx6eKMm_-6vIV1ZuRwPIXvYHAFHWQ",
      authDomain: "meme-encyclopedia.firebaseapp.com",
      projectId: "meme-encyclopedia",
      storageBucket: "meme-encyclopedia.firebasestorage.app",
      messagingSenderId: "496237997014",
      appId: "1:496237997014:web:382e628a4da83219ced277"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async user => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }

      const userRef = doc(db, "users", user.uid);
      const snap = await getDoc(userRef);
      const data = snap.data();

      document.getElementById("username").innerText = data.username || "No username set";
      document.getElementById("email").innerText = "Email: " + user.email;
      document.getElementById("bio").innerText = "Bio: " + (data.bio || "No bio yet");
      document.getElementById("coins").innerText = "Coins: " + data.coins;
      document.getElementById("joined").innerText = "Joined: " + (data.joined || "Unknown");

      document.getElementById("pfp").src = data.pfp || "https://i.imgur.com/4ZQZ4ZQ.png";
    });
  </script>

</body>
</html>
