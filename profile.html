<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Profile</title>

  <style>
    body {
      background: linear-gradient(135deg, #00ff00, #ff00ff, #0000ff);
      font-family: "Comic Sans MS", cursive, sans-serif;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    header {
      background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00, #00ffff, #ff00ff);
      padding: 20px;
      border-bottom: 4px solid #fff;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 10px #fff; }
      to { box-shadow: 0 0 30px #ff0; }
    }

    h1 {
      font-size: 3rem;
      text-shadow: 2px 2px 10px #000;
      margin: 0;
    }

    .profileBox {
      background: rgba(0,0,0,0.5);
      border: 3px solid #fff;
      width: 80%;
      margin: 20px auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px #fff;
      text-align: left;
    }

    .profileBox img {
      width: 150px;
      height: 150px;
      border-radius: 10px;
      border: 3px solid #fff;
      box-shadow: 0 0 20px #ff0;
      margin-bottom: 20px;
    }

    a {
      color: #0ff;
      font-weight: bold;
      text-decoration: none;
    }

    a:hover {
      text-shadow: 0 0 10px #fff;
    }

    .friendActions {
      margin-top: 20px;
    }

    .friendActions button {
      margin-right: 10px;
    }

    .postsBox {
      background: rgba(0,0,0,0.5);
      border: 3px solid #fff;
      width: 80%;
      margin: 20px auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px #fff;
      text-align: left;
    }
  </style>
</head>

<body>

<header>
  <h1>👤 Profile</h1>
</header>

<div class="profileBox">
  <img id="pfp" src="" alt="Profile Picture">

  <p id="username" style="font-size:1.5rem; font-weight:bold;"></p>
  <p id="email"></p>
  <p id="bio"></p>
  <p id="coins"></p>
  <p id="joined"></p>
  <p id="friendBadge"></p>

  <div class="friendActions" id="friendActions">
    <!-- Buttons will be injected here -->
  </div>

  <br>
  <a href="settings.html">⚙ Edit Profile</a>
  <br><br>
  <a href="index.html">🏠 Back to Home</a>
</div>

<div class="postsBox">
  <h2>📝 Posts by this user</h2>
  <div id="userPosts">
    <p>No posts yet.</p>
  </div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    getDoc,
    updateDoc,
    collection,
    query,
    where,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBcEOwx6eKMm_-6vIV1ZuRwPIXvYHAFHWQ",
    authDomain: "meme-encyclopedia.firebaseapp.com",
    projectId: "meme-encyclopedia",
    storageBucket: "meme-encyclopedia.firebasestorage.app",
    messagingSenderId: "496237997014",
    appId: "1:496237997014:web:382e628a4da83219ced277"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  function getQueryParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  async function loadUserPosts(targetUserId) {
    const postsDiv = document.getElementById("userPosts");
    postsDiv.innerHTML = "<p>Loading posts...</p>";

    const q = query(
      collection(db, "posts"),
      where("userID", "==", targetUserId)
    );

    const snap = await getDocs(q);

    if (snap.empty) {
      postsDiv.innerHTML = "<p>No posts yet.</p>";
      return;
    }

    postsDiv.innerHTML = "";
    snap.forEach(docSnap => {
      const data = docSnap.data();
      const div = document.createElement("div");
      div.style = "margin-bottom:10px;";

      div.innerHTML = `
        <p>${data.text}</p>
        <small>${data.timestamp?.toDate?.() || "Just now"}</small>
      `;

      postsDiv.appendChild(div);
    });
  }

  async function renderFriendButtons(currentUserId, currentData, profileUserId, profileData) {
    const container = document.getElementById("friendActions");
    const badge = document.getElementById("friendBadge");
    container.innerHTML = "";
    badge.innerText = "";

    if (currentUserId === profileUserId) {
      badge.innerText = "This is your profile.";
      return;
    }

    const friends = currentData.friends || [];
    const sentRequests = currentData.sentRequests || [];
    const incomingRequests = profileData.friendRequests || [];

    const isFriend = friends.includes(profileUserId);
    const hasSentRequest = sentRequests.includes(profileUserId);
    const hasIncomingFromCurrent = incomingRequests.includes(currentUserId);

    if (isFriend) {
      badge.innerText = "⭐ Friend";
      const unfriendBtn = document.createElement("button");
      unfriendBtn.innerText = "Unfriend";
      unfriendBtn.onclick = async () => {
        const newCurrentFriends = friends.filter(id => id !== profileUserId);
        const profileFriends = profileData.friends || [];
        const newProfileFriends = profileFriends.filter(id => id !== currentUserId);

        await updateDoc(doc(db, "users", currentUserId), {
          friends: newCurrentFriends
        });

        await updateDoc(doc(db, "users", profileUserId), {
          friends: newProfileFriends
        });

        const updatedCurrentSnap = await getDoc(doc(db, "users", currentUserId));
        const updatedProfileSnap = await getDoc(doc(db, "users", profileUserId));
        renderFriendButtons(
          currentUserId,
          updatedCurrentSnap.data(),
          profileUserId,
          updatedProfileSnap.data()
        );
      };
      container.appendChild(unfriendBtn);
      return;
    }

    if (hasSentRequest) {
      badge.innerText = "Friend request sent.";
      const cancelBtn = document.createElement("button");
      cancelBtn.innerText = "Cancel Request";
      cancelBtn.onclick = async () => {
        const newSent = sentRequests.filter(id => id !== profileUserId);
        const profileRequests = profileData.friendRequests || [];
        const newProfileRequests = profileRequests.filter(id => id !== currentUserId);

        await updateDoc(doc(db, "users", currentUserId), {
          sentRequests: newSent
        });

        await updateDoc(doc(db, "users", profileUserId), {
          friendRequests: newProfileRequests
        });

        const updatedCurrentSnap = await getDoc(doc(db, "users", currentUserId));
        const updatedProfileSnap = await getDoc(doc(db, "users", profileUserId));
        renderFriendButtons(
          currentUserId,
          updatedCurrentSnap.data(),
          profileUserId,
          updatedProfileSnap.data()
        );
      };
      container.appendChild(cancelBtn);
      return;
    }

    if (hasIncomingFromCurrent) {
      badge.innerText = "They have a request from you.";
      const cancelBtn = document.createElement("button");
      cancelBtn.innerText = "Cancel Request";
      cancelBtn.onclick = async () => {
        const newSent = sentRequests.filter(id => id !== profileUserId);
        const profileRequests = incomingRequests.filter(id => id !== currentUserId);

        await updateDoc(doc(db, "users", currentUserId), {
          sentRequests: newSent
        });

        await updateDoc(doc(db, "users", profileUserId), {
          friendRequests: profileRequests
        });

        const updatedCurrentSnap = await getDoc(doc(db, "users", currentUserId));
        const updatedProfileSnap = await getDoc(doc(db, "users", profileUserId));
        renderFriendButtons(
          currentUserId,
          updatedCurrentSnap.data(),
          profileUserId,
          updatedProfileSnap.data()
        );
      };
      container.appendChild(cancelBtn);
      return;
    }

    const sendBtn = document.createElement("button");
    sendBtn.innerText = "Send Friend Request";
    sendBtn.onclick = async () => {
      const newSent = Array.from(new Set([...(currentData.sentRequests || []), profileUserId]));
      const newProfileRequests = Array.from(new Set([...(profileData.friendRequests || []), currentUserId]));

      await updateDoc(doc(db, "users", currentUserId), {
        sentRequests: newSent
      });

      await updateDoc(doc(db, "users", profileUserId), {
        friendRequests: newProfileRequests
      });

      const updatedCurrentSnap = await getDoc(doc(db, "users", currentUserId));
      const updatedProfileSnap = await getDoc(doc(db, "users", profileUserId));
      renderFriendButtons(
        currentUserId,
        updatedCurrentSnap.data(),
        profileUserId,
        updatedProfileSnap.data()
      );
    };
    container.appendChild(sendBtn);
  }

  onAuthStateChanged(auth, async user => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    const currentUserId = user.uid;
    const targetUserId = getQueryParam("uid") || currentUserId;

    const currentUserRef = doc(db, "users", currentUserId);
    const currentSnap = await getDoc(currentUserRef);
    const currentData = currentSnap.data();

    const profileUserRef = doc(db, "users", targetUserId);
    const profileSnap = await getDoc(profileUserRef);
    const data = profileSnap.data();

    document.getElementById("username").innerText = "Username: " + (data.username || "Not set");
    document.getElementById("email").innerText = "Email: " + (data.email || user.email);
    document.getElementById("bio").innerText = "Bio: " + (data.bio || "No bio yet");
    document.getElementById("coins").innerText = "Coins: " + data.coins;
    document.getElementById("joined").innerText = "Joined: " + (data.joined || "Unknown");

    document.getElementById("pfp").src = data.pfp || "https://i.imgur.com/4ZQZ4ZQ.png";

    await renderFriendButtons(currentUserId, currentData, targetUserId, data);
    await loadUserPosts(targetUserId);
  });
</script>

</body>
</html>
