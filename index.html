<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meme Encyclopedia</title>
</head>
<body>
  <h1>Meme Encyclopedia</h1>
  <p>Welcome to the meme info site!</p>

  <h2>Memes</h2>
  <ul>
    <li><a href="memes/doge.html">Doge</a></li>
  </ul>

  <h3>Site Stats</h3>
  <p>Total visits: <span id="visits">Loading...</span></p>

  <script>
    fetch("https://api.counterapi.dev/v1/meme-site/visits")
      .then(res => res.json())
      .then(data => {
        document.getElementById("visits").innerText = data.count;
      })
      .catch(() => {
        document.getElementById("visits").innerText = "Error";
      });
  </script>

  <footer>
    <p>Created by <strong>Manper</strong></p>
  </footer>
</body>
</html>
