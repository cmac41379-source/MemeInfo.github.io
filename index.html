<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meme Encyclopedia</title>

  <style>
    body {
      background: linear-gradient(135deg, #ff00cc, #3333ff);
      font-family: "Comic Sans MS", cursive, sans-serif;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    header {
      background: linear-gradient(90deg, #00ff00, #ff0000, #0000ff);
      padding: 20px;
      border-bottom: 4px solid #fff;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 10px #fff; }
      to { box-shadow: 0 0 30px #ff0; }
    }

    h1 {
      font-size: 3rem;
      text-shadow: 2px 2px 10px #000;
      margin: 0;
    }

    .banner {
      background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00, #00ffff, #ff00ff);
      padding: 10px;
      font-weight: bold;
      border: 3px solid #fff;
      margin: 20px auto;
      width: 80%;
      animation: rainbow 5s linear infinite;
    }

    @keyframes rainbow {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    .container {
      background-color: rgba(0, 0, 0, 0.4);
      border: 3px solid #fff;
      margin: 20px auto;
      width: 80%;
      padding: 20px;
      box-shadow: 0 0 20px #fff;
    }

    ul {
      list-style-type: none;
      padding: 0;
    }

    ul li {
      margin: 15px 0;
    }

    ul li a {
      background: linear-gradient(90deg, #ff00ff, #00ffff);
      color: #000;
      padding: 10px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 0 10px #fff;
      transition: 0.2s;
    }

    ul li a:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px #ff0;
    }

    footer {
      background: #000;
      color: #0f0;
      padding: 10px;
      font-size: 1rem;
      border-top: 3px solid #fff;
      text-shadow: 0 0 10px #0f0;
    }
  </style>
</head>

<body>
  <header>
    <h1>✨ THE MEME ENCYCLOPEDIA ✨</h1>
    <p><strong>Welcome, traveler of the internet!</strong></p>
  </header>

  <div class="banner">
    🎉 WELCOME TO THE OFFICIAL MEME ARCHIVE 🎉 YOU’VE ENTERED THE MEME ZONE 🎉
  </div>

  <div class="container">
    <h2>🔥 Legendary Memes 🔥</h2>
    <ul>
      <li><a href="memes/doge.html">🐶 Doge</a></li>
    </ul>
  </div>

  <footer>
    Created by <strong>Manper</strong> — Est. 2026 🌀
  </footer>
</body>
</html>
